<title>Claim Register</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a receipt roll. Month header, category tally, dated list, sticky add button. */
:root {
  --bg: #eef1f4;
  --paper: #ffffff;
  --ink: #17212b;
  --muted: #5d6b78;
  --line: #d9dfe5;
  --accent: #1f5fd1;
  --accent-ink: #ffffff;
  --ok: #1d7a4c;
  --ok-bg: #e2f3ea;
  --warn: #9a5b00;
  --warn-bg: #fdf0d9;
  --danger: #b3261e;
  --c-petrol: #c46a00;
  --c-meal: #2e8540;
  --c-toll: #1f5fd1;
  --c-job: #7a3fc4;
  --c-port: #0b8291;
  --c-misc: #66727e;
  --shadow: 0 1px 2px rgba(20,30,45,.06), 0 4px 16px rgba(20,30,45,.06);
  --f-display: "Space Grotesk", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --paper: #18212a; --ink: #e6ecf1; --muted: #93a1ae; --line: #2a3642;
    --accent: #6c9ff5; --accent-ink: #0b1220; --ok: #6fd19c; --ok-bg: #173527; --warn: #f0b85c; --warn-bg: #3a2c12;
    --danger: #ff8a80; --c-petrol: #f0a04b; --c-meal: #6cc47f; --c-toll: #6c9ff5; --c-job: #b58cf0; --c-port: #4fc3cf; --c-misc: #9aa6b2;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --paper: #18212a; --ink: #e6ecf1; --muted: #93a1ae; --line: #2a3642;
  --accent: #6c9ff5; --accent-ink: #0b1220; --ok: #6fd19c; --ok-bg: #173527; --warn: #f0b85c; --warn-bg: #3a2c12;
  --danger: #ff8a80; --c-petrol: #f0a04b; --c-meal: #6cc47f; --c-toll: #6c9ff5; --c-job: #b58cf0; --c-port: #4fc3cf; --c-misc: #9aa6b2;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 110px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top h1 { font-size: 22px; letter-spacing: -.01em; }
.monthnav { display: flex; align-items: center; gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.monthnav button { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 8px; font-size: 18px; color: var(--muted); }
.monthnav button:hover { background: var(--bg); color: var(--ink); }
.monthnav span { min-width: 92px; text-align: center; font-weight: 600; font-size: 14px; }

/* Summary slip */
.slip { background: var(--paper); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 14px; position: relative; }
.slip::after { content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 8px;
  background: radial-gradient(circle at 6px 0, transparent 5px, var(--paper) 5.5px) 0 0/12px 8px repeat-x; }
.total-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.total { font-family: var(--f-mono); font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
.total small { font-size: 15px; color: var(--muted); font-weight: 500; margin-right: 4px; }
.status-split { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.pending { background: var(--warn-bg); color: var(--warn); }
.pill.claimed { background: var(--ok-bg); color: var(--ok); }
.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .cats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cat { text-align: left; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cat .nm { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat .amt { font-family: var(--f-mono); font-size: 15px; font-weight: 600; }
.cat .cnt { font-size: 11px; color: var(--muted); }
.cat[aria-pressed="true"] { border-color: var(--k); box-shadow: inset 0 0 0 1px var(--k); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--k); flex: none; }
.slip-actions { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 12px; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
.ghost:hover { background: var(--bg); }
.ghost[disabled] { opacity: .5; cursor: default; }

/* List */
.day { display: flex; flex-direction: column; gap: 8px; }
.day-h { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; }
.day-h h3 { font-size: 14px; font-weight: 600; }
.day-h .mono { font-size: 13px; color: var(--muted); }
.entry { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--paper); border-radius: 12px; padding: 10px; border: 1px solid var(--line); border-left: 4px solid var(--k); text-align: left; width: 100%; }
.thumb { width: 52px; height: 52px; border-radius: 8px; background: var(--bg); object-fit: cover; display: grid; place-items: center; color: var(--muted); font-size: 10px; text-align: center; border: 0; padding: 0; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.entry .meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.entry .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.entry .r .mono { font-weight: 600; }
.empty { background: var(--paper); border: 1px dashed var(--line); border-radius: 14px; padding: 28px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty strong { color: var(--ink); font-family: var(--f-display); font-size: 17px; }
.notice { font-size: 13px; color: var(--warn); background: var(--warn-bg); border-radius: 10px; padding: 10px 12px; }

/* Add button */
.fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 14px 26px; font-weight: 700; font-size: 16px; box-shadow: 0 6px 20px rgba(31,95,209,.35); display: flex; gap: 8px; align-items: center; }
.fab[disabled] { opacity: .5; }

/* Sheet */
dialog { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; width: 100%; height: 100%; margin: 0; }
dialog::backdrop { background: rgba(10,15,20,.55); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--paper); color: var(--ink); border-radius: 18px 18px 0 0;
  padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 700px) { .sheet { bottom: auto; top: 50%; transform: translateY(-50%); border-radius: 18px; } }
.sheet-h { display: flex; justify-content: space-between; align-items: center; }
.sheet-h h2 { font-size: 19px; }
.x { border: 0; background: var(--bg); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input, .field select, .field textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; font-size: 16px; }
.field textarea { resize: vertical; min-height: 64px; }
.row2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
.choose { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.choose button, .seg button { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 10px 6px; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.choose button[aria-pressed="true"] { border-color: var(--k); background: color-mix(in srgb, var(--k) 12%, transparent); color: var(--ink); }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.seg button { padding: 8px 6px; }
.seg button[aria-pressed="true"] { border-color: var(--c-meal); background: color-mix(in srgb, var(--c-meal) 12%, transparent); }
.amount-wrap { position: relative; }
.amount-wrap span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-family: var(--f-mono); font-size: 15px; }
.amount-wrap input { padding-left: 40px; font-family: var(--f-mono); }
.photo { border: 1.5px dashed var(--line); border-radius: 12px; padding: 14px; display: flex; gap: 12px; align-items: center; }
.photo img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
.photo .ph-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.photo label { cursor: pointer; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 16px; width: 100%; }
.primary[disabled] { opacity: .6; cursor: progress; }
.sheet-foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
.err { color: var(--danger); font-size: 13px; }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--ok); }
.viewer { position: fixed; inset: 0; background: rgba(5,8,12,.92); z-index: 20; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px; }
.viewer img { max-height: 90vh; max-width: 100%; border-radius: 6px; }
.viewer button { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); background: rgba(255,255,255,.15); color: #fff; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 30; }
@media (prefers-reduced-motion: no-preference) { .entry { transition: transform .12s; } .entry:active { transform: scale(.99); } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Claim Register</h1>
    <div class="monthnav" aria-label="Month">
      <button id="prevM" aria-label="Previous month">‹</button>
      <span id="monthLbl">—</span>
      <button id="nextM" aria-label="Next month">›</button>
    </div>
  </header>

  <section class="slip" aria-label="Month summary">
    <div class="total-row">
      <div>
        <div class="label">Total to claim</div>
        <div class="total" id="total"><small>RM</small>0.00</div>
      </div>
      <div class="status-split" id="split"></div>
    </div>
    <div class="cats" id="cats"></div>
    <div class="slip-actions">
      <button class="ghost" id="exportBtn">Export month (CSV)</button>
      <button class="ghost" id="markAllBtn">Mark month as claimed</button>
      <span id="markConfirm" hidden>
        <button class="ghost danger" id="markYes">Yes, mark all</button>
        <button class="ghost" id="markNo">Cancel</button>
      </span>
    </div>
  </section>

  <div id="notice" class="notice" hidden></div>
  <main id="list" class="wrap" style="gap:18px">
    <div class="empty" id="loading"><strong>Loading your receipts…</strong><span>Your saved claims will appear here.</span></div>
  </main>
</div>

<button class="fab" id="addBtn"><span style="font-size:20px;line-height:1">＋</span> Add receipt</button>

<dialog id="dlg">
  <form class="sheet" id="form" novalidate>
    <div class="sheet-h">
      <h2 id="formTitle">New receipt</h2>
      <button type="button" class="x" id="closeBtn" aria-label="Close">×</button>
    </div>

    <div class="field">
      <span class="label">Category</span>
      <div class="choose" id="catChoose"></div>
    </div>

    <div class="field" id="mealField" hidden>
      <span class="label">Meal</span>
      <div class="seg" id="mealSeg">
        <button type="button" data-meal="Breakfast">Breakfast</button>
        <button type="button" data-meal="Lunch">Lunch</button>
        <button type="button" data-meal="Dinner">Dinner</button>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label class="label" for="fDate">Date</label>
        <input type="date" id="fDate" required>
      </div>
      <div class="field" id="amountField">
        <label class="label" for="fAmount">Amount</label>
        <div class="amount-wrap"><span>RM</span><input id="fAmount" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
      </div>
    </div>

    <div class="field" id="locField">
      <label class="label" for="fLoc" id="locLbl">Location</label>
      <input id="fLoc" placeholder="e.g. Westport, Klang" autocomplete="off">
    </div>

    <div class="field">
      <label class="label" for="fNote" id="noteLbl">Note</label>
      <input id="fNote" placeholder="e.g. Shell Bukit Raja, 30L" autocomplete="off">
    </div>

    <div class="field" id="photoField">
      <span class="label">Receipt photo</span>
      <div class="photo">
        <img id="photoPrev" alt="Receipt preview" hidden>
        <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
          <div class="ph-btns">
            <label class="ghost" for="fCam">Take photo</label>
            <label class="ghost" for="fFile">Choose from gallery</label>
            <button type="button" class="ghost danger" id="photoRemove" hidden>Remove</button>
          </div>
          <span class="label" id="photoState" style="text-transform:none;letter-spacing:0;font-weight:500">No photo yet</span>
        </div>
        <input type="file" id="fCam" accept="image/*" capture="environment" hidden>
        <input type="file" id="fFile" accept="image/*,application/pdf" hidden>
      </div>
    </div>

    <label class="toggle" id="claimedWrap"><input type="checkbox" id="fClaimed"> Already claimed / submitted to company</label>

    <div class="err" id="formErr" hidden></div>
    <button class="primary" id="saveBtn" type="submit">Save receipt</button>
    <div class="sheet-foot" id="editFoot" hidden>
      <button type="button" class="ghost danger" id="delBtn">Delete entry</button>
      <span id="delConfirm" hidden>
        <button type="button" class="ghost danger" id="delYes">Delete for good</button>
        <button type="button" class="ghost" id="delNo">Keep</button>
      </span>
    </div>
  </form>
</dialog>

<div class="viewer" id="viewer" hidden>
  <img id="viewerImg" alt="Receipt">
  <button class="x" id="viewerClose" aria-label="Close photo">×</button>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const CATS = [
  { id: "petrol", name: "Petrol", k: "var(--c-petrol)", hint: "e.g. Petronas Klang, RON95 40L" },
  { id: "meal",   name: "Meals",  k: "var(--c-meal)",   hint: "e.g. Restoran with team" },
  { id: "toll",   name: "Toll",   k: "var(--c-toll)",   hint: "e.g. Plaza Tol Bukit Raja" },
  { id: "job",    name: "Job location", k: "var(--c-job)", hint: "e.g. Vessel inspection, job ref" },
  { id: "port",   name: "Port registration", k: "var(--c-port)", hint: "e.g. Westport pass" },
  { id: "misc",   name: "Misc",   k: "var(--c-misc)",   hint: "e.g. Parking, stationery" },
];
const catById = Object.fromEntries(CATS.map(c => [c.id, c]));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const rm = n => (Number(n) || 0).toLocaleString("en-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

let db = null, assets = null, downloads = null, col = null;
let entries = [];          // [{id, ...data}]
let loaded = false;
let month = todayISO().slice(0, 7);
let filter = null;         // category id or null
let editing = null;        // id or null
let form = {};             // working copy
let pendingPhoto = null;   // {blob, url}

function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200); }
function notice(msg) { const n = $("notice"); n.textContent = msg || ""; n.hidden = !msg; }

/* ---------- render ---------- */
function monthLabel(m) { const [y, mo] = m.split("-"); return MONTHS[+mo - 1] + " " + y; }
function shiftMonth(d) { let [y, m] = month.split("-").map(Number); m += d; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } month = y + "-" + String(m).padStart(2, "0"); filter = null; render(); }
function entryTitle(e) {
  if (e.category === "meal") return e.meal ? e.meal : "Meal";
  if (e.category === "job") return e.location || "Job location";
  return e.note || catById[e.category]?.name || "Receipt";
}
function entrySub(e) {
  const c = catById[e.category]?.name || "Misc";
  const bits = [c];
  if (e.category === "job") { if (e.note) bits.push(e.note); }
  else { if (e.category === "meal" && e.note) bits.push(e.note); if (e.location) bits.push(e.location); }
  return bits.join(" · ");
}
function photoSrc(e) { return e.photo ? "/_blob/" + e.photo : null; }

function render() {
  $("monthLbl").textContent = monthLabel(month);
  const inMonth = entries.filter(e => (e.date || "").startsWith(month));
  const sum = (arr) => arr.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const total = sum(inMonth);
  const pending = inMonth.filter(e => !e.claimed), claimed = inMonth.filter(e => e.claimed);
  $("total").innerHTML = "<small>RM</small>" + rm(total);
  $("split").innerHTML = inMonth.length
    ? `<span class="pill pending">Pending RM ${rm(sum(pending))}</span><span class="pill claimed">Claimed RM ${rm(sum(claimed))}</span>`
    : "";
  $("cats").innerHTML = CATS.map(c => {
    const items = inMonth.filter(e => e.category === c.id);
    const val = c.id === "job" ? `${items.length} day${items.length === 1 ? "" : "s"}` : "RM " + rm(sum(items));
    const cnt = c.id === "job" ? (items.length ? "logged" : "none yet") : `${items.length} receipt${items.length === 1 ? "" : "s"}`;
    return `<button class="cat" style="--k:${c.k}" data-cat="${c.id}" aria-pressed="${filter === c.id}">
      <span class="nm"><span class="dot"></span>${c.name}</span><span class="amt">${val}</span><span class="cnt">${cnt}</span></button>`;
  }).join("");
  $("markAllBtn").disabled = !pending.length || !db;
  $("exportBtn").disabled = !inMonth.length;

  const list = $("list");
  if (!loaded) return;
  const shown = inMonth.filter(e => !filter || e.category === filter)
    .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || "").localeCompare(a.createdAt || ""));
  if (!shown.length) {
    list.innerHTML = `<div class="empty"><strong>${filter ? "No " + esc(catById[filter].name.toLowerCase()) + " entries" : "No receipts for " + monthLabel(month)}</strong>
      <span>Tap <b>Add receipt</b>, pick a category, snap the receipt and enter the amount.</span></div>`;
    return;
  }
  const byDay = {};
  shown.forEach(e => (byDay[e.date] ||= []).push(e));
  list.innerHTML = Object.entries(byDay).map(([d, items]) => {
    const dt = new Date(d + "T00:00:00");
    const jobs = items.filter(e => e.category === "job").map(e => e.location).filter(Boolean);
    const head = `${DAYS[dt.getDay()]}, ${dt.getDate()} ${MONTHS[dt.getMonth()]}${jobs.length ? " · " + esc(jobs.join(", ")) : ""}`;
    return `<section class="day"><div class="day-h"><h3>${head}</h3><span class="mono">RM ${rm(sum(items))}</span></div>
      ${items.map(e => {
        const c = catById[e.category] || catById.misc;
        const src = photoSrc(e);
        const thumb = src ? `<span class="thumb" data-view="${esc(e.photo)}" role="button" aria-label="View receipt photo"><img src="${src}" alt="" loading="lazy" onerror="this.parentNode.textContent='photo missing'"></span>`
                          : `<span class="thumb">${e.category === "job" ? "job" : "no photo"}</span>`;
        const amt = (e.category === "job" && !Number(e.amount)) ? "" : `<span class="mono">RM ${rm(e.amount)}</span>`;
        return `<div class="entry" style="--k:${c.k}" data-edit="${esc(e.id)}" role="button" tabindex="0">
          ${thumb}
          <span class="meta"><span class="t">${esc(entryTitle(e))}</span><span class="s">${esc(entrySub(e))}</span></span>
          <span class="r">${amt}<span class="pill ${e.claimed ? "claimed" : "pending"}">${e.claimed ? "Claimed" : "Pending"}</span></span>
        </div>`;
      }).join("")}</section>`;
  }).join("");
}

/* ---------- form ---------- */
function setCat(id) {
  form.category = id;
  [...$("catChoose").children].forEach(b => b.setAttribute("aria-pressed", b.dataset.cat === id));
  $("mealField").hidden = id !== "meal";
  const isJob = id === "job";
  $("locLbl").textContent = isJob ? "Job location" : "Location (optional)";
  $("fLoc").placeholder = isJob ? "e.g. Northport, Pelabuhan Klang" : "e.g. Klang";
  $("noteLbl").textContent = isJob ? "Job details (optional)" : "Note / vendor";
  $("fNote").placeholder = catById[id].hint;
  $("fAmount").placeholder = isJob ? "optional" : "0.00";
  $("locField").style.order = isJob ? -1 : 0;
}
function setMeal(m) { form.meal = m; [...$("mealSeg").children].forEach(b => b.setAttribute("aria-pressed", b.dataset.meal === m)); }
function guessMeal() { const h = new Date().getHours(); return h < 11 ? "Breakfast" : h < 17 ? "Lunch" : "Dinner"; }
function showPhoto(url) {
  const img = $("photoPrev");
  if (url) { img.src = url; img.hidden = false; $("photoState").textContent = "Photo attached"; $("photoRemove").hidden = false; }
  else { img.hidden = true; img.removeAttribute("src"); $("photoState").textContent = "No photo yet"; $("photoRemove").hidden = true; }
}

function openForm(id) {
  editing = id || null;
  const e = id ? entries.find(x => x.id === id) : null;
  form = e ? { ...e } : { category: filter || "petrol", date: todayISO(), meal: guessMeal(), claimed: false };
  if (pendingPhoto?.url) URL.revokeObjectURL(pendingPhoto.url);
  pendingPhoto = null;
  $("formTitle").textContent = e ? "Edit entry" : "New receipt";
  $("saveBtn").textContent = e ? "Save changes" : "Save receipt";
  $("fDate").value = form.date || todayISO();
  $("fAmount").value = form.amount ? Number(form.amount).toFixed(2) : "";
  $("fLoc").value = form.location || "";
  $("fNote").value = form.note || "";
  $("fClaimed").checked = !!form.claimed;
  $("editFoot").hidden = !e; $("delConfirm").hidden = true; $("delBtn").hidden = false;
  $("formErr").hidden = true;
  $("photoField").hidden = !assets;
  setCat(form.category); setMeal(form.meal || guessMeal());
  showPhoto(form.photo ? "/_blob/" + form.photo : null);
  $("saveBtn").disabled = false;
  $("dlg").showModal();
}
function closeForm() { $("dlg").close(); }

async function compress(file) {
  if (!file.type.startsWith("image/")) return file;
  try {
    const bmp = await createImageBitmap(file);
    const max = 1800, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.82));
    return blob && blob.size < file.size ? blob : file;
  } catch { return file; }
}
async function onPick(ev) {
  const f = ev.target.files?.[0]; ev.target.value = "";
  if (!f) return;
  $("photoState").textContent = "Preparing photo…";
  const blob = await compress(f);
  if (pendingPhoto?.url) URL.revokeObjectURL(pendingPhoto.url);
  pendingPhoto = { blob, url: f.type === "application/pdf" ? null : URL.createObjectURL(blob) };
  form.photo = null;
  showPhoto(pendingPhoto.url);
  if (!pendingPhoto.url) { $("photoState").textContent = "PDF attached"; $("photoRemove").hidden = false; }
}

async function save(ev) {
  ev.preventDefault();
  const err = msg => { $("formErr").textContent = msg; $("formErr").hidden = false; };
  if (!db) return err("Saving isn't available here. Open this page signed in to claude.ai as its owner.");
  const amountRaw = $("fAmount").value.replace(/[^0-9.]/g, "");
  const amount = amountRaw ? Math.round(parseFloat(amountRaw) * 100) / 100 : 0;
  const date = $("fDate").value;
  if (!date) return err("Pick the receipt date.");
  if (form.category !== "job" && !(amount > 0)) return err("Enter the amount on the receipt, for example 45.50.");
  if (form.category === "job" && !$("fLoc").value.trim()) return err("Enter the job location.");
  $("saveBtn").disabled = true; $("saveBtn").textContent = pendingPhoto ? "Uploading photo…" : "Saving…";
  try {
    let photo = form.photo || null;
    if (pendingPhoto && assets) {
      const up = await assets.upload(pendingPhoto.blob);
      photo = up.id;
    }
    const data = {
      category: form.category, date, amount,
      meal: form.category === "meal" ? form.meal : null,
      location: $("fLoc").value.trim(), note: $("fNote").value.trim(),
      claimed: $("fClaimed").checked, photo,
      createdAt: form.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString(),
    };
    const ref = editing ? col.doc(editing) : col.doc();
    await ref.set(data);
    if (!editing) month = date.slice(0, 7);
    closeForm(); toast(editing ? "Changes saved" : "Receipt saved");
  } catch (e) {
    $("saveBtn").disabled = false; $("saveBtn").textContent = editing ? "Save changes" : "Save receipt";
    err(e?.code === "quota_exceeded" ? "Storage is full. Delete old entries or photos, then try again." :
        e?.code === "too_large" || /large/i.test(e?.message || "") ? "That photo is too large (max 20 MB). Try another photo." :
        "Couldn't save: " + (e?.message || "unknown error") + ". Check your connection and try again.");
  }
}

async function del() {
  if (!editing) return;
  const e = entries.find(x => x.id === editing);
  try {
    await col.doc(editing).delete();
    if (e?.photo && assets) assets.delete(e.photo).catch(() => {});
    closeForm(); toast("Entry deleted");
  } catch (x) { $("formErr").textContent = "Couldn't delete: " + (x?.message || "error"); $("formErr").hidden = false; }
}

async function markAll() {
  $("markConfirm").hidden = true; $("markAllBtn").hidden = false;
  const pend = entries.filter(e => (e.date || "").startsWith(month) && !e.claimed);
  let n = 0;
  for (const e of pend) { try { await col.doc(e.id).update({ claimed: true, updatedAt: new Date().toISOString() }); n++; } catch {} }
  toast(`${n} entr${n === 1 ? "y" : "ies"} marked as claimed`);
}

async function exportCsv() {
  const rows = entries.filter(e => (e.date || "").startsWith(month)).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [["Date","Category","Meal","Amount (RM)","Location","Note","Status","Receipt photo"].map(q).join(",")];
  rows.forEach(e => lines.push([e.date, catById[e.category]?.name, e.meal || "", (Number(e.amount) || 0).toFixed(2), e.location, e.note, e.claimed ? "Claimed" : "Pending", e.photo ? "Yes" : "No"].map(q).join(",")));
  const total = rows.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  lines.push(["", "TOTAL", "", total.toFixed(2), "", "", "", ""].map(q).join(","));
  const csv = "﻿" + lines.join("\r\n");
  if (!downloads) { toast("Download isn't available in this view"); return; }
  try { await downloads.save({ filename: `claims-${month}.csv`, data: csv }); }
  catch (e) { if (e?.code !== "declined") toast("Couldn't save the file"); }
}

/* ---------- wiring ---------- */
$("catChoose").innerHTML = CATS.map(c => `<button type="button" style="--k:${c.k}" data-cat="${c.id}"><span class="dot"></span>${c.name}</button>`).join("");
$("catChoose").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (b) setCat(b.dataset.cat); });
$("mealSeg").addEventListener("click", e => { const b = e.target.closest("[data-meal]"); if (b) setMeal(b.dataset.meal); });
$("fCam").addEventListener("change", onPick);
$("fFile").addEventListener("change", onPick);
$("photoRemove").addEventListener("click", () => { pendingPhoto = null; form.photo = null; showPhoto(null); });
$("form").addEventListener("submit", save);
$("closeBtn").addEventListener("click", closeForm);
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) closeForm(); });
$("delBtn").addEventListener("click", () => { $("delConfirm").hidden = false; $("delBtn").hidden = true; });
$("delNo").addEventListener("click", () => { $("delConfirm").hidden = true; $("delBtn").hidden = false; });
$("delYes").addEventListener("click", del);
$("addBtn").addEventListener("click", () => openForm(null));
$("prevM").addEventListener("click", () => shiftMonth(-1));
$("nextM").addEventListener("click", () => shiftMonth(1));
$("cats").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (!b) return; filter = filter === b.dataset.cat ? null : b.dataset.cat; render(); });
$("exportBtn").addEventListener("click", exportCsv);
$("markAllBtn").addEventListener("click", () => { $("markConfirm").hidden = false; $("markAllBtn").hidden = true; });
$("markNo").addEventListener("click", () => { $("markConfirm").hidden = true; $("markAllBtn").hidden = false; });
$("markYes").addEventListener("click", markAll);
$("list").addEventListener("click", e => {
  const v = e.target.closest("[data-view]");
  if (v) { e.stopPropagation(); $("viewerImg").src = "/_blob/" + v.dataset.view; $("viewer").hidden = false; return; }
  const r = e.target.closest("[data-edit]"); if (r) openForm(r.dataset.edit);
});
$("list").addEventListener("keydown", e => { if (e.key === "Enter") { const r = e.target.closest("[data-edit]"); if (r) openForm(r.dataset.edit); } });
$("viewerClose").addEventListener("click", () => $("viewer").hidden = true);
$("viewer").addEventListener("click", e => { if (e.target === $("viewer")) $("viewer").hidden = true; });

render();

(async () => {
  const c = window.claude;
  if (!c?.use) { loaded = true; notice("Open this page on claude.ai to save receipts."); render(); return; }
  [db, assets, downloads] = await Promise.all([c.use("db"), c.use("assets"), c.use("downloads")]);
  if (!db) { loaded = true; $("addBtn").disabled = true; notice("Sign in to claude.ai as this page's owner to see and save your receipts."); render(); return; }
  if (!assets) notice("Photo upload isn't available in this view. You can still record amounts.");
  col = db.collection("entries");
  const timer = setTimeout(() => { if (!loaded) { loaded = true; notice("Still connecting to your saved receipts. Check your connection."); render(); } }, 10000);
  col.onSnapshot(snap => {
    clearTimeout(timer);
    entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded = true;
    if ($("notice").textContent.startsWith("Still connecting")) notice("");
    render();
  }, err => { clearTimeout(timer); loaded = true; notice("Couldn't load receipts (" + (err?.code || "error") + "). Reload the page to try again."); render(); });
})();
</script>
